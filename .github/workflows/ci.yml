name: Tsun CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  daemon:
    name: C++ daemon
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev libxml2-dev
      - name: Build and test
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel 2
          ctest --test-dir build --output-on-failure

  android:
    name: Android APK (${{ matrix.build }})
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - build: debug
            tasks: ":app:assembleDebug :app:lintDebug"
          - build: release
            tasks: ":app:assembleRelease :app:lintRelease"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
        with:
          gradle-version: '8.11.1'
      - name: Locate the runner's Android SDK
        run: |
          sdk="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          test -r "$sdk/platforms/android-35/android.jar"
          test -x "$sdk/build-tools/35.0.0/aapt2"
          printf 'ANDROID_HOME=%s\n' "$sdk" >> "$GITHUB_ENV"
      - name: Build and lint
        working-directory: android
        run: gradle --no-daemon ${{ matrix.tasks }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Tsun-${{ matrix.build }}
          path: android/app/build/outputs/apk/${{ matrix.build }}/app-${{ matrix.build }}.apk
          if-no-files-found: error
