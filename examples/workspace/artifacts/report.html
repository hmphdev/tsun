<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Field Notes — Local report</title>
  <style>
    :root { color-scheme: light dark; --paper: #f7f4ed; --ink: #222a26; --pine: #29594b; --rule: #d9d5ca; }
    @media (prefers-color-scheme: dark) {
      :root { --paper: #202622; --ink: #edeae0; --pine: #b7d2be; --rule: #444f45; }
    }
    body { background: var(--paper); color: var(--ink); margin: 0; font: 17px/1.5 system-ui, sans-serif; }
    main { max-width: 40rem; margin: auto; padding: 2rem 1.4rem; }
    small { color: var(--pine); font: 600 .72rem/1.4 monospace; letter-spacing: .17em; }
    h1 { margin: .45rem 0 .7rem; font: 400 clamp(2rem, 8vw, 4rem)/1.04 Georgia, serif; }
    p { margin: 0 0 1.4rem; }
    dl { border-top: 1px solid var(--rule); margin: 0; }
    dl div { display: flex; justify-content: space-between; gap: 1rem; padding: .65rem 0; border-bottom: 1px solid var(--rule); }
    dd { color: var(--pine); margin: 0; text-align: right; }
  </style>
</head>
<body>
  <main>
    <small>TSUN / FIELD NOTES</small>
    <h1>Everything stayed local.</h1>
    <p>This is an HTML file in your Debian workspace, rendered with its own inline styles. No scripts or network requests.</p>
    <dl>
      <div><dt>Source</dt><dd>Debian workspace</dd></div>
      <div><dt>Artifact</dt><dd>Offline report</dd></div>
      <div><dt>Next</dt><dd>Open field.png</dd></div>
    </dl>
  </main>
</body>
</html>
